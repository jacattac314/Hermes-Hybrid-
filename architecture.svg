<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="640" fill="#0f1117"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="bold">Hermes Hybrid Router — Architecture</text>

  <!-- CLIENT -->
  <rect x="370" y="60" width="160" height="52" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="450" y="81" text-anchor="middle" fill="#38bdf8" font-weight="bold">Client</text>
  <text x="450" y="99" text-anchor="middle" fill="#94a3b8" font-size="11">POST /chat</text>

  <!-- Client → FastAPI -->
  <line x1="450" y1="112" x2="450" y2="148" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- FASTAPI -->
  <rect x="310" y="148" width="280" height="52" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
  <text x="450" y="169" text-anchor="middle" fill="#818cf8" font-weight="bold">FastAPI  main.py</text>
  <text x="450" y="187" text-anchor="middle" fill="#94a3b8" font-size="11">/chat  /health  /memory</text>

  <!-- FastAPI → Memory (retrieve, solid) — lands on top-right of Memory box -->
  <line x1="328" y1="200" x2="175" y2="244" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="232" y="226" text-anchor="middle" fill="#64748b" font-size="10">retrieve</text>

  <!-- Memory → FastAPI (save, dashed) — departs top of Memory box, slightly offset right -->
  <line x1="208" y1="244" x2="345" y2="200" stroke="#475569" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <text x="312" y="217" text-anchor="start" fill="#64748b" font-size="10">save</text>

  <!-- FastAPI → Router -->
  <line x1="450" y1="200" x2="450" y2="244" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- MEMORY (ChromaDB) -->
  <rect x="80" y="244" width="200" height="80" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <text x="180" y="267" text-anchor="middle" fill="#34d399" font-weight="bold">memory.py</text>
  <text x="180" y="285" text-anchor="middle" fill="#94a3b8" font-size="11">ChromaDB  (RAG)</text>
  <text x="180" y="303" text-anchor="middle" fill="#64748b" font-size="10">save · retrieve · clear</text>

  <!-- ROUTER -->
  <rect x="310" y="244" width="280" height="80" rx="8" fill="#1e293b" stroke="#f472b6" stroke-width="1.5"/>
  <text x="450" y="267" text-anchor="middle" fill="#f472b6" font-weight="bold">router.py</text>
  <text x="450" y="285" text-anchor="middle" fill="#94a3b8" font-size="11">Hermes 3 70B  (local)</text>
  <text x="450" y="303" text-anchor="middle" fill="#64748b" font-size="10">returns RouterDecision JSON</text>

  <!-- Router → Dispatcher -->
  <line x1="450" y1="324" x2="450" y2="374" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="472" y="354" fill="#64748b" font-size="11">decision</text>

  <!-- SHARED MODULES -->
  <rect x="80" y="374" width="200" height="80" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="180" y="397" text-anchor="middle" fill="#94a3b8" font-weight="bold" font-size="12">Shared Modules</text>
  <text x="180" y="416" text-anchor="middle" fill="#64748b" font-size="11">schemas.py  ·  config.py</text>
  <text x="180" y="434" text-anchor="middle" fill="#64748b" font-size="11">prompts.py</text>

  <!-- DISPATCHER -->
  <rect x="310" y="374" width="280" height="80" rx="8" fill="#1e293b" stroke="#fb923c" stroke-width="1.5"/>
  <text x="450" y="397" text-anchor="middle" fill="#fb923c" font-weight="bold">dispatcher.py</text>
  <text x="450" y="415" text-anchor="middle" fill="#94a3b8" font-size="11">LiteLLM  ·  fallback chain</text>
  <text x="450" y="433" text-anchor="middle" fill="#64748b" font-size="10">Gemini → Groq → Local</text>

  <!-- WORKERS -->
  <rect x="60" y="510" width="160" height="68" rx="8" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="140" y="533" text-anchor="middle" fill="#60a5fa" font-weight="bold">Gemini</text>
  <text x="140" y="551" text-anchor="middle" fill="#94a3b8" font-size="11">gemini-1.5-pro</text>
  <text x="140" y="568" text-anchor="middle" fill="#64748b" font-size="10">long-context / creative</text>

  <rect x="370" y="510" width="160" height="68" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="450" y="533" text-anchor="middle" fill="#a78bfa" font-weight="bold">Groq</text>
  <text x="450" y="551" text-anchor="middle" fill="#94a3b8" font-size="11">llama-3.1-70b</text>
  <text x="450" y="568" text-anchor="middle" fill="#64748b" font-size="10">fast chat / coding</text>

  <rect x="680" y="510" width="160" height="68" rx="8" fill="#1e293b" stroke="#86efac" stroke-width="1.5"/>
  <text x="760" y="533" text-anchor="middle" fill="#86efac" font-weight="bold">Local Ollama</text>
  <text x="760" y="551" text-anchor="middle" fill="#94a3b8" font-size="11">llama3.2:3b</text>
  <text x="760" y="568" text-anchor="middle" fill="#64748b" font-size="10">private / classification</text>

  <!-- Dispatcher → workers -->
  <line x1="380" y1="454" x2="180" y2="510" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="450" y1="454" x2="450" y2="510" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="520" y1="454" x2="720" y2="510" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Fallback labels -->
  <text x="262" y="490" text-anchor="middle" fill="#64748b" font-size="10">primary</text>
  <text x="450" y="490" text-anchor="middle" fill="#64748b" font-size="10">fallback 1</text>
  <text x="638" y="490" text-anchor="middle" fill="#64748b" font-size="10">fallback 2</text>
</svg>
